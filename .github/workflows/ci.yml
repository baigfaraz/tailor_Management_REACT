name: CI

on:
  push:
    branches: [master, improvement]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests
        # Non-blocking until the broken CRA test setup is replaced in TEST-001/TEST-002.
        continue-on-error: true
        run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          # CRA treats warnings as errors when CI=true; keep that strictness.
          CI: true
